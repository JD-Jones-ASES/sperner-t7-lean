# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A 7-vertex tournament whose Sperner capacity exceeds the order of its largest transitive subtournament: T₇, induced by the Paley tournament on 23 vertices on 0, 1, 2, 3, 9, 14, 18, has t = 4 and √18 ≤ C ≤ 5; every tournament on at most six vertices has C = t, so seven is the least order"
  description: >-
    A Lean 4 development on the capacity of digraphs in the sense of Alon (1998): w(R^n) is the
    largest set of words of length n such that every ordered pair of distinct words has a coordinate
    carrying an arc from the first to the second, and C(R) is the supremum of w(R^n)^(1/n), which
    equals the limit; for a tournament T, t(T) is the order of its largest transitive subtournament
    and t(T) ≤ C(T). Conjecture 1.1 of Alon's paper, attributed to Körner and Simonyi, asserts
    C(T) = t(T) for every tournament; Alon disproved it with a random construction and with the
    Paley tournament on 67 vertices, and asked for the smallest tournament on which the equality
    fails. Let T7 be the subtournament of the Paley tournament on 23 vertices (x → y iff y − x is a
    nonzero square mod 23) induced on 0, 1, 2, 3, 9, 14, 18. Proved here: T7 is a tournament with
    t(T7) = 4; eighteen listed points of T7 × T7 form a transitive clique of its second Sperner
    power; hence, by the lift lemma (N injective points of the k-th power, each earlier one dominating
    each later one in some coordinate, give for every m a clique of the km-th power of size at least
    N^m / ((N − 1)m + 1), by words of fixed index sum), some Sperner power of T7 has a clique larger
    than 4^n, √18 ≤ C(T7), and t(T7) < C(T7); C(T7) ≤ 5, by an explicit rank-5 factorization over
    GF(2) of a matrix with nonzero diagonal and zeros on the arcs, through the rank bound (a clique of
    the n-th power indexes a nonsingular diagonal submatrix of the n-th Kronecker power, which
    factors through F^(r^n)); the general statements N^(1/k) ≤ C(R), t(R) ≤ C(R), C(R) ≤ r for any
    such factorization, and C(R) ≤ |V|; and, for the Paley tournament on 23 vertices, t = 5 and
    √29 ≤ C from a 29-point transitive clique of its second Sperner power; and every tournament on
    at most six vertices satisfies C(T) = t(T) (for each of the 1, 1, 1, 2, 4, 12, 56 isomorphism
    classes on 0 to 6 vertices, a representative with a rank-t factorization over GF(2) and a
    transitive t-chain, and a kernel check, by a bitset over all orientations, that every labelled
    tournament on at most six vertices is a relabelling of a representative), so a tournament with
    t < C has at least seven vertices and seven is the least order of a counterexample. The capacity
    is formalized in its supremum form. On paper, in the research note of the repository, with
    standard-library certificates: the square value 18 is exact; on seven vertices 455 of the 456
    isomorphism classes have a rank-t matrix over GF(2) and the exception is T7, which is therefore
    the unique smallest counterexample up to isomorphism; every proper subtournament of T7 satisfies
    the equality; and the Paley tournament on 7 vertices has C = 3. The smallest example previously
    exhibited has 67 vertices (examples on 27 and 26 vertices follow from Alon's argument over GF(27)
    with a published value of t). Nothing in Lean is claimed about tournaments on seven or more vertices other than T7 and
    the Paley tournament on 23 vertices.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

classification:
  arxiv: ["math.CO", "cs.IT"]
  msc2020: ["05C20", "05C35", "94A24"]

sources:
  - title: "On the Capacity of Digraphs"
    authors: ["Noga Alon"]
    id: "doi:10.1006/eujc.1997.0148"
    type: "paper"
    location: "European Journal of Combinatorics 19 (1998), no. 1, 1-5; Section 1 (definitions, Conjecture 1.1, Theorem 1.2), Section 4 (Q_p, Q_67, the smallest-size question)"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >-
      Supplies the definitions of w(G^n) and of the capacity as the supremum of w(G^n)^(1/n), restated in
      Challenge.lean; Conjecture 1.1, attributed there to Körner and Simonyi; Theorem 1.2 (the capacity is
      at most the maximum outdegree plus one); and Q_67, the explicit counterexample with which the paper
      disproves the conjecture. The relationship is "other" because the theorems proved here are not in
      the paper: T7 is a smaller counterexample to a conjecture this paper already disproved, answering
      its question about the smallest size. The elementary facts t(T) <= C(T) and C(R) <= |V| that the
      paper calls easy are proved in Lean; nothing of the proofs of Theorems 1.2 and 1.3 is formalized.
  - title: "A 7-vertex tournament whose Sperner capacity exceeds the order of its largest transitive subtournament (the research note of this repository)"
    authors: ["JD Jones"]
    id: "note/main.tex and note/main.pdf in this repository (CC BY-SA 4.0)"
    type: "original-proof"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      T7, its 18-point transitive clique of the second Sperner power, the rank-5 factorization over ZMod 2,
      and the Paley tournament on 23 vertices with its 29-point transitive clique are first presented in
      this note, and the Lean development formalizes them, with the lift lemma in an elementary form (its
      substance is standard; see Sali and Simonyi below) and the rank bound over any field. The
      note also carries the parts that are on paper only, each with a standard-library certificate: the
      square value 18 is exact; every tournament on at most six vertices has capacity equal to its
      transitive number; on seven vertices T7 is the only exception up to isomorphism, so seven is the
      least order of a counterexample; every proper subtournament of T7 has capacity equal to its
      transitive number.
  - title: "On Clique Growth in Products of Directed Graphs"
    authors: ["János Körner"]
    id: "doi:10.1007/s003730050012"
    type: "paper"
    location: "Graphs and Combinatorics 14 (1998), no. 1, 25-36"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The reference Alon gives for Conjecture 1.1. Cited for the conjecture's provenance only; nothing from
      it is formalized.
  - title: "A Sperner-type theorem and qualitative independence"
    authors: ["János Körner", "Gábor Simonyi"]
    id: "doi:10.1016/0097-3165(92)90100-9"
    type: "paper"
    location: "Journal of Combinatorial Theory, Series A 59 (1992), no. 1, 90-103"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "With the paper below, where the capacity of digraphs was introduced. Background only."
  - title: "Qualitative independence and Sperner problems for directed graphs"
    authors: ["Luisa Gargano", "János Körner", "Ugo Vaccaro"]
    id: "doi:10.1016/0097-3165(92)90016-N"
    type: "paper"
    location: "Journal of Combinatorial Theory, Series A 61 (1992), no. 2, 173-192"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Introduces the Sperner capacity (the logarithm of the capacity used here). Background only.
  - title: "Capacities: from information theory to extremal set theory"
    authors: ["Luisa Gargano", "János Körner", "Ugo Vaccaro"]
    id: "doi:10.1016/0097-3165(94)90108-2"
