  - title: "The Sperner Capacity of Linear and Nonlinear Codes for the Cyclic Triangle"
    authors: ["A. Robert Calderbank", "Peter Frankl", "Ronald L. Graham", "Wen-Ching W. Li", "Lawrence A. Shepp"]
    id: "doi:10.1023/A:1022424630332"
    type: "paper"
    location: "Journal of Algebraic Combinatorics 2 (1993), no. 1, 31-48"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The capacity of the cyclic triangle is 2, the result that prompted the conjecture; Kiviluoto,
      Östergård and Vaskelainen credit the rank bound to this paper. The Lean rank bound
      capacity_le_of_factorization is written independently; nothing is taken from the paper's text.
  - title: "On the Sperner Capacity of the Cyclic Triangle"
    authors: ["Aart Blokhuis"]
    id: "doi:10.1023/A:1022455407000"
    type: "paper"
    location: "Journal of Algebraic Combinatorics 2 (1993), no. 2, 123-124"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      A short polynomial proof for the cyclic triangle, the method behind Alon's Theorem 1.2. Background
      only.
  - title: "On Some Problems of Lovász Concerning the Shannon Capacity of a Graph"
    authors: ["Willem H. Haemers"]
    id: "doi:10.1109/TIT.1979.1056027"
    type: "paper"
    location: "IEEE Transactions on Information Theory 25 (1979), no. 2, 231-232"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The rank method for the Shannon capacity. Alon 1998 describes the digraph methods of Calderbank et
      al. and Blokhuis as a modification of it, and the rank bound proved here is its digraph form.
      Background only.
  - title: "On Tournaments Free of Large Transitive Subtournaments"
    authors: ["Adolfo Sanchez-Flores"]
    id: "doi:10.1007/s003730050025"
    type: "paper"
    location: "Graphs and Combinatorics 14 (1998), no. 2, 181-200"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The Galois tournament on 27 points has no transitive subtournament on 6 vertices, and neither does the
      quadratic-residue tournament on 23 points (as reported by Neiman, Mackey and Heule). With Alon's
      anti-diagonal this makes 27- and 26-vertex counterexamples implicit in print; the note re-verifies
      them by certificate. The Lean value t = 5 for the 23-vertex tournament is proved independently.
  - title: "Sperner capacity of small digraphs"
    authors: ["Lasse Kiviluoto", "Patric R. J. Östergård", "Vesa P. Vaskelainen"]
    id: "doi:10.3934/amc.2009.3.125"
    type: "paper"
    location: "Advances in Mathematics of Communications 3 (2009), no. 2, 125-133; Theorem 4, Figure 4, Section 4"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >-
      Their Theorem 4 is the rank bound over the reals (ones on the diagonal, zeros on the arcs), which
      they credit to Calderbank et al.; capacity_le_of_factorization is a version over any field, with
      a proof written for this repository (the paper prints none). They determine the Sperner capacity
      of every digraph on at most five vertices except eight, none of them a tournament, which settles
      every tournament on at most five vertices; the note extends this to six and seven vertices by
      certificate. Nothing of their computations is formalized.
  - title: "Graph powers"
    authors: ["Noga Alon"]
    id: "https://web.math.princeton.edu/~nalon/PDFS/cap2.pdf"
    type: "paper"
    location: "In: B. Bollobás (ed.), Contemporary Combinatorics, Bolyai Society Mathematical Studies 10 (2002), 11-28 (Zbl 1003.05102); Section 5"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
