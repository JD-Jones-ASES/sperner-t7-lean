status:
  scope: >-
    Nineteen compared theorems over nine compared definitions (the Paley tournament on ZMod 23,
    the seven residues, T7, tournaments, transitive chains, the transitive number, Sperner cliques,
    the clique number and the capacity in supremum form). Unconditional, all of them: T7 is a
    tournament with transitive number 4; the 18-point transitive clique of its second Sperner power;
    a clique larger than 4^n in some power; 4 < C(T7); √18 ≤ C(T7); C(T7) ≤ 5; t(T7) < C(T7); the
    lift lemma; N^(1/k) ≤ C(R); t(R) ≤ C(R); the rank bound; C(R) ≤ |V|; the Paley tournament on 23
    vertices is a tournament with transitive number 5, 5 < C and √29 ≤ C; every tournament on at
    most six vertices has C = t; a tournament with t < C has at least seven vertices. Not in Lean:
    the exactness of the square value 18, the uniqueness of T7 on seven vertices, and the capacity
    of the Paley tournament on 7 vertices, which are established on paper with standard-library
    certificates in note/. The intentional
    placeholders of Challenge.lean are excluded from proof counts; Solution.lean does not import
    Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
