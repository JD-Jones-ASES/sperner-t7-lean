fidelity:
  notes: >-
    The capacity is defined as the supremum over n ≥ 1 of w(R^n)^(1/n), which Alon's paper states
    is equal to the limit; the limit form is not formalized. T7 is defined as the induced
    subtournament of the Paley tournament on ZMod 23 through the residue map W, not by an arc table.
    The transitive number is the supremum of the lengths of injective transitive chains. The
    compared definitions are restated character for character in SpernerCapacity/Defs.lean with the
    same imports as the Challenge.

automation:
  methods:
    - method: "agent"
      tool_setup: "Claude (Anthropic) in Claude Code: the computations, the proofs, the searches, the checkers and the repository text"
      notes: >-
        The 7-vertex tournament was found by a vertex-deletion search inside the Paley tournament on
        23 vertices; the exact square value, the rank certificates and the census of tournaments on
        at most seven vertices were computed with CP-SAT, CaDiCaL and plain Python, each by at least
        two independent programs; the standard-library certificates under note/certificates/ are the
        travelling checks. Human direction and review by the author; see DISCLOSURE.md.

review:
  status: "self-assessed"
  notes: >-
    The local checks of VERIFICATION.md (the build with the axiom audit, the source guard, the
    definition and statement comparisons, the elaboration check of the compared definitions, the
    certificates, Palomar's core-notation audit of the statements) were run by the author's agent
    before submission. No independent human review.
